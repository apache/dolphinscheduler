version: "3.8"

services:
  dolphinscheduler:
    image: myrepo/dolphinscheduler-standalone-server:ci
    environment:
      WORKER_TENANT_AUTO_CREATE: 'true'
    ports:
      - "12345:12345"
    volumes:
      - ./application.yaml:/opt/dolphinscheduler/standalone-server/conf/application.yaml
    networks:
      - api-test
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:12345/dolphinscheduler/actuator/health" ]
      interval: 5s
      timeout: 60s
      retries: 120
    depends_on:
      - keycloak
      - postgres
  postgres:
    image: postgres:14.1
    restart: always
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_PASSWORD: postgres
    networks:
      - api-test
    expose:
      - 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 60s
      retries: 120
  keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./realm-dolphinscheduler.json:/opt/keycloak/data/import/realm-dolphinscheduler.json
    ports:
      - "8080:8080"
    networks:
      - api-test
    depends_on:
      postgres:
        condition: service_healthy

networks:
  api-test: