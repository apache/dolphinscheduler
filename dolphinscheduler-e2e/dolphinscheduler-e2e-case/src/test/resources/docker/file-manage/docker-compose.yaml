version: "3.8"

services:
  dolphinscheduler:
    image: apache/dolphinscheduler-standalone-server:ci
    environment:
      MASTER_SERVER_LOAD_PROTECTION_MAX_SYSTEM_CPU_USAGE_PERCENTAGE_THRESHOLDS: 0.95
      MASTER_SERVER_LOAD_PROTECTION_MAX_JVM_CPU_USAGE_PERCENTAGE_THRESHOLDS: 0.95
      MASTER_SERVER_LOAD_PROTECTION_MAX_SYSTEM_MEMORY_USAGE_PERCENTAGE_THRESHOLDS: 0.95
      MASTER_SERVER_LOAD_PROTECTION_MAX_DISK_USAGE_PERCENTAGE_THRESHOLDS: 0.95
      MASTER_KILL_APPLICATION_WHEN_TASK_FAILOVER: 'true'
      WORKER_SERVER_LOAD_PROTECTION_MAX_SYSTEM_CPU_USAGE_PERCENTAGE_THRESHOLDS: 0.95
      WORKER_SERVER_LOAD_PROTECTION_MAX_JVM_CPU_USAGE_PERCENTAGE_THRESHOLDS: 0.95
      WORKER_SERVER_LOAD_PROTECTION_MAX_SYSTEM_MEMORY_USAGE_PERCENTAGE_THRESHOLDS: 0.95
      WORKER_SERVER_LOAD_PROTECTION_MAX_DISK_USAGE_PERCENTAGE_THRESHOLDS: 0.95
      WORKER_TENANT_CONFIG_AUTO_CREATE_TENANT_ENABLED: 'true'
    ports:
      - "12345:12345"
    networks:
      - e2e
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:12345/dolphinscheduler/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 120
    volumes:
      - ./common.properties:/opt/dolphinscheduler/standalone-server/conf/common.properties
      - ./aws.yaml:/opt/dolphinscheduler/standalone-server/conf/aws.yaml
    depends_on:
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
  s3:
    image: chrislusf/seaweedfs:4.48
    hostname: s3
    command: ["mini", "-dir=/data", "-s3.port=9000"]
    ports:
      - "9000:9000"
    networks:
      - e2e
    environment:
      AWS_ACCESS_KEY_ID: accessKey123
      AWS_SECRET_ACCESS_KEY: secretKey123
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/readyz"]
      interval: 5s
      timeout: 5s
      retries: 120
  s3-init:
    image: public.ecr.aws/aws-cli/aws-cli:2.37.4
    environment:
      AWS_ACCESS_KEY_ID: accessKey123
      AWS_SECRET_ACCESS_KEY: secretKey123
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
    networks:
      - e2e
    command:
      - --endpoint-url
      - http://s3:9000
      - s3api
      - create-bucket
      - --bucket
      - dolphinscheduler
    depends_on:
      s3:
        condition: service_healthy
networks:
  e2e:
    driver: bridge
    ipam:
      config:
        - subnet: 10.1.0.0/24
          gateway: 10.1.0.1
