version: "3.8"

services:
  dolphinscheduler-postgresql:
    image: bitnami/postgresql:15.2.0
    ports:
      - "5432:5432"
    environment:
      POSTGRESQL_USERNAME: root
      POSTGRESQL_PASSWORD: root
      POSTGRESQL_DATABASE: dolphinscheduler
    volumes:
      - dolphinscheduler-postgresql:/bitnami/postgresql
    healthcheck:
      test: [ "CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/5432" ]
      interval: 5s
      timeout: 60s
      retries: 120
    networks:
      - e2e

  dolphinscheduler-schema-initializer:
    image: apache/dolphinscheduler-standalone-server:ci
    command: [ tools/bin/upgrade-schema.sh ]
    environment:
      DOLPHINSCHEDULER_HOME: /opt/dolphinscheduler/tools
    depends_on:
      dolphinscheduler-postgresql:
        condition: service_healthy
    volumes:
      - /home/runner/work/dolphinscheduler/dolphinscheduler/apache-dolphinscheduler-dev-SNAPSHOT-bin:/opt/dolphinscheduler
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
      - dolphinscheduler-resource-local:/dolphinscheduler
    networks:
      - e2e

  dolphinscheduler-zookeeper:
    image: bitnami/zookeeper:3.7.1
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
      ZOO_4LW_COMMANDS_WHITELIST: srvr,ruok,wchs,cons
    volumes:
      - dolphinscheduler-zookeeper:/bitnami/zookeeper
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/2181"]
      interval: 5s
      timeout: 60s
      retries: 120
    networks:
      - e2e

  dolphinscheduler-api:
    image: apache/dolphinscheduler-standalone-server:ci
    environment:
      MASTER_MAX_CPU_LOAD_AVG: 100
      WORKER_TENANT_AUTO_CREATE: 'true'
      DOLPHINSCHEDULER_HOME: /opt/dolphinscheduler/api-server
    ports:
      - "12345:12345"
      - "25333:25333"
    networks:
      - e2e
    healthcheck:
      test: [ "CMD", "curl", "http://127.0.0.1:12345/dolphinscheduler/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 120
    depends_on:
      dolphinscheduler-zookeeper:
        condition: service_healthy
    volumes:
      - /home/runner/work/dolphinscheduler/dolphinscheduler/apache-dolphinscheduler-dev-SNAPSHOT-bin:/opt/dolphinscheduler
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
      - dolphinscheduler-resource-local:/dolphinscheduler
    command: [ "/bin/bash", "/opt/dolphinscheduler/api-server/bin/start.sh" ]

  dolphinscheduler-alert:
    image: apache/dolphinscheduler-standalone-server:ci
    environment:
      MASTER_MAX_CPU_LOAD_AVG: 100
      WORKER_TENANT_AUTO_CREATE: 'true'
      DOLPHINSCHEDULER_HOME: /opt/dolphinscheduler/alert-server
    networks:
      - e2e
    healthcheck:
      test: [ "CMD", "curl", "http://127.0.0.1:50053/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 120
    depends_on:
      dolphinscheduler-zookeeper:
        condition: service_healthy
    volumes:
      - /home/runner/work/dolphinscheduler/dolphinscheduler/apache-dolphinscheduler-dev-SNAPSHOT-bin:/opt/dolphinscheduler
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
    command: [ "/bin/bash", "/opt/dolphinscheduler/alert-server/bin/start.sh" ]

  dolphinscheduler-master:
    image: apache/dolphinscheduler-standalone-server:ci
    environment:
      MASTER_MAX_CPU_LOAD_AVG: 100
      WORKER_TENANT_AUTO_CREATE: 'true'
      DOLPHINSCHEDULER_HOME: /opt/dolphinscheduler/master-server
    networks:
      - e2e
    healthcheck:
      test: [ "CMD", "curl", "http://127.0.0.1:5679/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 120
    depends_on:
      dolphinscheduler-zookeeper:
        condition: service_healthy
    volumes:
      - /home/runner/work/dolphinscheduler/dolphinscheduler/apache-dolphinscheduler-dev-SNAPSHOT-bin:/opt/dolphinscheduler
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
    command: [ "/bin/bash", "/opt/dolphinscheduler/master-server/bin/start.sh" ]

  dolphinscheduler-worker:
    image: apache/dolphinscheduler-standalone-server:ci
    environment:
      MASTER_MAX_CPU_LOAD_AVG: 100
      WORKER_TENANT_AUTO_CREATE: 'true'
      DOLPHINSCHEDULER_HOME: /opt/dolphinscheduler/worker-server
    networks:
      - e2e
    healthcheck:
      test: [ "CMD", "curl", "http://127.0.0.1:1235/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 120
    depends_on:
      dolphinscheduler-zookeeper:
        condition: service_completed_successfully
    volumes:
      - /home/runner/work/dolphinscheduler/dolphinscheduler/apache-dolphinscheduler-dev-SNAPSHOT-bin:/opt/dolphinscheduler
      - dolphinscheduler-worker-data:/tmp/dolphinscheduler
      - dolphinscheduler-logs:/opt/dolphinscheduler/logs
      - dolphinscheduler-shared-local:/opt/soft
      - dolphinscheduler-resource-local:/dolphinscheduler
    command: [ "/bin/bash", "/opt/dolphinscheduler/worker-server/bin/start.sh" ]

networks:
  e2e:

volumes:
  dolphinscheduler-postgresql:
  dolphinscheduler-zookeeper:
  dolphinscheduler-worker-data:
  dolphinscheduler-logs:
  dolphinscheduler-shared-local:
  dolphinscheduler-resource-local:
