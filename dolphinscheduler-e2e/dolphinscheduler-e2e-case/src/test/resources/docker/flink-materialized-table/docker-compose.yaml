version: "3.8"

services:
  dolphinscheduler:
    image: apache/dolphinscheduler-standalone-server:ci
    environment:
      MASTER_MAX_CPU_LOAD_AVG: 400
      MASTER_RESERVED_MEMORY: 0.01
      WORKER_TENANT_AUTO_CREATE: 'true'
    ports:
      - "12345:12345"
    networks:
      - e2e
    depends_on:
      - jobmanager
      - taskmanager
      - flink-sql-gateway
    healthcheck:
      test: [ "CMD", "curl", "http://localhost:12345/dolphinscheduler/actuator/health" ]
      interval: 5s
      timeout: 5s
      retries: 120
  jobmanager:
    image: flink:2.0
    ports:
      - "8081:8081"
    networks:
      - e2e
    entrypoint: ['bash', '-c', '/bin/bash /docker/download-testfilesystem.sh && /docker-entrypoint.sh jobmanager']
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
    volumes:
      - ./download-testfilesystem.sh:/docker/download-testfilesystem.sh:rw,Z
      - ./catalog_store:/catalog_store:rw

  taskmanager:
    image: flink:2.0
    depends_on:
      - jobmanager
    networks:
      - e2e
    entrypoint: ['bash', '-c', '/bin/bash /docker/download-testfilesystem.sh && /docker-entrypoint.sh taskmanager']
    scale: 1
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./download-testfilesystem.sh:/docker/download-testfilesystem.sh:rw,Z
      - ./catalog_store:/catalog_store:rw
  flink-sql-gateway:
    image: flink:2.0
    ports:
      - "8083:8083"
    entrypoint: ['bash', '-c', '/bin/bash /docker/download-testfilesystem.sh &&  /docker-entrypoint.sh bin/sql-gateway.sh start-foreground']
    hostname: flink-sql-gateway
    networks:
      - e2e
    depends_on:
      - jobmanager
    environment:
      - |
        FLINK_PROPERTIES=
        jobmanager.rpc.address: jobmanager
        rest.address: jobmanager
        sql-gateway.endpoint.rest.address: flink-sql-gateway
        sql-gateway.endpoint.bind.address: flink-sql-gateway
        table.catalog-store.kind: file
        table.catalog-store.file.path: /catalog_store
    volumes:
      - ./download-testfilesystem.sh:/docker/download-testfilesystem.sh:rw,Z
      - ./catalog_store:/catalog_store:rw
networks:
  e2e:
