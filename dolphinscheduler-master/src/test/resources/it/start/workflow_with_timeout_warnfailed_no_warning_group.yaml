project:
  name: MasterIntegrationTest
  code: 1
  description: Project for testing WARNFAILED timeout without warningGroupId
  userId: 1
  userName: admin
  createTime: 2024-08-12 00:00:00
  updateTime: 2024-08-12 00:00:00

# Workflow with WARNFAILED task but NO warningGroupId → should kill task but NOT send alert
workflows:
  - name: workflow_with_timeout_warnfailed_no_warning_group
    code: 1
    version: 1
    projectCode: 1
    description: WARNFAILED task with null warningGroupId, kill on timeout, no alert
    releaseState: ONLINE
    createTime: 2024-08-12 00:00:00
    updateTime: 2024-08-12 00:00:00
    userId: 1
    executionType: PARALLEL
    # warningGroupId is intentionally omitted → treated as null

tasks:
  - name: warnfailed_task_no_alert_due_to_missing_warning_group
    code: 1
    version: 1
    projectCode: 1
    userId: 1
    timeoutFlag: 'OPEN'
    timeoutNotifyStrategy: 'WARNFAILED'  # Should kill + (conditionally) alert
    timeout: 1                           # 1 minute timeout
    taskType: LogicFakeTask
    taskParams: '{"localParams":[],"shellScript":"sleep 120","resourceList":[]}'  # Runs 120s > timeout
    workerGroup: default
    createTime: 2024-08-12 00:00:00
    updateTime: 2024-08-12 00:00:00
    taskExecuteType: BATCH

taskRelations:
  - projectCode: 1
    workflowDefinitionCode: 1
    workflowDefinitionVersion: 1
    preTaskCode: 0
    preTaskVersion: 0
    postTaskCode: 1
    postTaskVersion: 1
    createTime: 2024-08-12 00:00:00
    updateTime: 2024-08-12 00:00:00