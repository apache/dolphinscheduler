project:
  name: MasterIntegrationTest
  code: 1
  description: This is a fake project for testing timeout WARNFAILED alerts
  userId: 1
  userName: admin
  createTime: 2024-08-12 00:00:00
  updateTime: 2024-08-12 00:00:00

# Workflow with WARNFAILED timeout strategy
workflows:
  - name: workflow_with_timeout_warnfailed_task
    code: 1
    version: 1
    projectCode: 1
    description: Workflow with task using WARNFAILED timeout strategy (alert + kill)
    releaseState: ONLINE
    createTime: 2024-08-12 00:00:00
    updateTime: 2024-08-12 00:00:00
    userId: 1
    executionType: PARALLEL
    warningGroupId: 1

# Task that triggers WARNFAILED on timeout
tasks:
  - name: warnfailed_task_with_timeout_alert_kill
    code: 1
    version: 1
    projectCode: 1
    userId: 1
    timeoutFlag: 'OPEN'                       # Enable timeout mechanism
    timeoutNotifyStrategy: 'WARNFAILED'       # Only send alert and kill task on timeout
    timeout: 1                                # Timeout after 1 minute
    taskType: LogicFakeTask
    taskParams: '{"localParams":[],"shellScript":"sleep 120","resourceList":[]}'
    workerGroup: default
    createTime: 2024-08-12 00:00:00
    updateTime: 2024-08-12 00:00:00
    taskExecuteType: BATCH

taskRelations:
  - projectCode: 1
    workflowDefinitionCode: 1
    workflowDefinitionVersion: 1
    preTaskCode: 0
    preTaskVersion: 0
    postTaskCode: 1
    postTaskVersion: 1
    createTime: 2024-08-12 00:00:00
    updateTime: 2024-08-12 00:00:00