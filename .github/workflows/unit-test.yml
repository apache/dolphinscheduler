name: Test

on:
  pull_request:
  push:
    paths-ignore:
      - '**/*.md'
      - 'dolphinscheduler-ui'
    branches:
      - '[0-9]+.[0-9]+.[0-9]+-prepare'
      - '[0-9]+.[0-9]+.[0-9]+-release'
      - 'dev'

env:
  LOG_DIR: /tmp/dolphinscheduler

concurrency:
  group: unit-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paths-filter:
    name: Unit-Test-Path-Filter
    runs-on: ubuntu-latest
    outputs:
      not-ignore: ${{ steps.filter.outputs.not-ignore }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        id: filter
        with:
          filters: |
            not-ignore:
              - '!(docs/**)'

  unit-test:
    name: Unit-Test (Java ${{ matrix.java }} | Shard ${{ matrix.shard }})
    needs: paths-filter
    if: ${{ (needs.paths-filter.outputs.not-ignore == 'true') || (github.event_name == 'push') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [ '8', '11' ]
        shard:
          - modules: >-
              dolphinscheduler-common,
              dolphinscheduler-data-quality,
              dolphinscheduler-api
            name: core-api
          - modules: >-
              dolphinscheduler-service,
              dolphinscheduler-dao,
              dolphinscheduler-registry/dolphinscheduler-registry-plugins
            name: service-dao
          - modules: >-
              dolphinscheduler-task-plugin,
              dolphinscheduler-datasource-plugin,
              dolphinscheduler-storage-plugin
            name: plugins
          - modules: >-
              dolphinscheduler-master,
              dolphinscheduler-worker,
              dolphinscheduler-alert,
              dolphinscheduler-extract,
              dolphinscheduler-tools
            name: master-worker-alert
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Collect Workflow Telemetry
        uses: ./.github/actions/workflow-telemetry-action
        with:
          comment_on_pr: false

      - name: Sanity Check
        uses: ./.github/actions/sanity-check
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'adopt'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-backend
          restore-keys: ${{ runner.os }}-maven-

      - name: Run Unit Tests (Shard ${{ matrix.shard.name }})
        run: |
          export MAVEN_OPTS="-Xmx8g -XX:MetaspaceSize=256m -XX:MaxMetaspaceSize=1024m"
          ./mvnw clean verify -B \
            -pl ${{ matrix.shard.modules }} \
            -am \
            -Dmaven.test.skip=false \
            -Dspotless.skip=true \
            -DskipUT=false \
            -Danalyze.skip=true

      - name: Collect jacoco exec files
        if: always()
        run: |
          mkdir -p /tmp/jacoco-exec
          find . -name "jacoco.exec" -exec cp --backup=numbered {} /tmp/jacoco-exec/ \;

      - name: Upload jacoco exec
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-exec-java${{ matrix.java }}-${{ matrix.shard.name }}
          path: /tmp/jacoco-exec/
          retention-days: 1

      - name: Upload surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-java${{ matrix.java }}-${{ matrix.shard.name }}
          path: '**/target/surefire-reports/'
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.java == '11'
        run: CODECOV_TOKEN="09c2663f-b091-4258-8a47-c981827eb29a" bash <(curl -s https://codecov.io/bash)

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: unit-test
    if: ${{ always() && (needs.paths-filter.outputs.not-ignore == 'true' || github.event_name == 'push') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Download all jacoco exec files (Java 11)
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-exec-java11-*
          path: all-jacoco-exec/
          merge-multiple: true

      - name: Set up JDK 17 for SonarCloud
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'adopt'

      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}-backend
          restore-keys: ${{ runner.os }}-maven-

      - name: Merge JaCoCo exec files
        run: |
          ./mvnw jacoco:merge \
            -Djacoco.dataFileIncludes="all-jacoco-exec/*.exec" \
            -Djacoco.destFile=target/merged.exec \
            -Dspotless.skip=true \
            -Dmaven.test.skip=true

      - name: Generate merged JaCoCo XML report
        run: |
          ./mvnw jacoco:report \
            -Djacoco.dataFile=target/merged.exec \
            -Dspotless.skip=true \
            -Dmaven.test.skip=true

      - name: Run SonarCloud Analysis
        run: >
          ./mvnw --batch-mode verify sonar:sonar
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dmaven.test.skip=true
          -Dspotless.skip=true
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=apache
          -Dsonar.core.codeCoveragePlugin=jacoco
          -Dsonar.projectKey=apache-dolphinscheduler
          -Dsonar.token=e4058004bc6be89decf558ac819aa1ecbee57682
          -Dsonar.exclusions=dolphinscheduler-ui/src/**/i18n/locale/*.js,dolphinscheduler-microbench/src/**/*
          -Dhttp.keepAlive=false
          -Dmaven.wagon.http.pool=false
          -Dmaven.wagon.httpconnectionManager.ttlSeconds=120
          -DskipUT=true
          -Danalyze.skip=true

  publish-test-results:
    name: Publish Test Results
    runs-on: ubuntu-latest
    needs: unit-test
    if: always()
    steps:
      - name: Download all surefire reports
        uses: actions/download-artifact@v4
        with:
          pattern: surefire-java11-*
          path: all-surefire/
          merge-multiple: true

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: all-surefire/**/*.xml
          comment_mode: off

  result:
    name: Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [ unit-test, paths-filter, sonar ]
    if: always()
    steps:
      - name: Status
        run: |
          if [[ ${{ needs.paths-filter.outputs.not-ignore }} == 'false' && ${{ github.event_name }} == 'pull_request' ]]; then
            echo "Skip Unit Test!"
            exit 0
          fi
          if [[ ${{ needs.unit-test.result }} != 'success' ]]; then
            echo "Unit Test Failed!"
            exit -1
          fi
          if [[ ${{ needs.sonar.result }} != 'success' ]]; then
            echo "SonarCloud Analysis Failed!"
            exit -1
          fi
