version: "3.8"

services:
  dolphinscheduler-postgresql:
    image: bitnami/postgresql:15.2.0
    environment:
      POSTGRESQL_USERNAME: root
      POSTGRESQL_PASSWORD: root
      POSTGRESQL_DATABASE: dolphinscheduler
    ports:
      - "5432:5432"
    volumes:
      - ds-postgresql:/bitnami/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "root"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dolphinscheduler

  dolphinscheduler-zookeeper:
    image: bitnami/zookeeper:3.7.1
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "22181:2181"
    volumes:
      - ds-zookeeper:/bitnami/zookeeper
    networks:
      - dolphinscheduler

  dolphinscheduler-standalone:
    image: apache/dolphinscheduler-standalone-server:3.2.1
    depends_on:
      - dolphinscheduler-postgresql
      - dolphinscheduler-zookeeper
    ports:
      - "12345:12345"   # API端口
      - "12333:12333"   # Web UI端口
    environment:
      - DATABASE_TYPE=postgresql
      - SPRING_DATASOURCE_URL=jdbc:postgresql://dolphinscheduler-postgresql:5432/dolphinscheduler
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - TZ=Asia/Shanghai
    networks:
      - dolphinscheduler

networks:
  dolphinscheduler:
    driver: bridge

volumes:
  ds-postgresql:
  ds-zookeeper:
