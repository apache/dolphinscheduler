syntax = "proto3";

package org.apache.dolphinscheduler.task.grpc.proto;

option java_package = "org.apache.dolphinscheduler.plugin.task.grpc.generated";
option java_multiple_files = true;
option java_outer_classname = "TaskTesterProto";

service TaskTester {
  rpc SayHello (HelloRequest) returns (HelloReply) {}
  rpc SayHelloAgain (HelloRequest) returns (HelloReply) {}
}

message HelloRequest {
  string username = 1;
}

message HelloReply {
  string message = 1;
}
